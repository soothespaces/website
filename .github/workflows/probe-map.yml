# Temporary: logs the network requests map.fo.umich.edu makes. Removed after use.
name: Probe campus map

on:
  push:
    branches-ignore:
      - main
    paths:
      - "scripts/probe/**"
      - ".github/workflows/probe-map.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm install playwright@1.56.1 && npx playwright install --with-deps chromium
        working-directory: scripts/probe
      - run: node map-requests.mjs
        working-directory: scripts/probe
